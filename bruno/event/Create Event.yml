info:
  name: Create Event
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/event?id=1
  params:
    - name: id
      value: "1"
      type: query
  body:
    type: json
    data: |-
      {
          "name": "Birthday?",
          "description": "Having a birthday party I suppose",
          "groupId": 1,
          "hostId": 1,
          "dates": [
            "2026-03-24T12:00:00.000",
            "2027-03-24T12:00:00.000",
            "2028-03-24T12:00:00.000",
            "2029-03-24T12:00:00.000",
            "2030-03-24T12:00:00.000"
          ],
          "repetition": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
