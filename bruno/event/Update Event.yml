info:
  name: Update Event
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:3000/event?id=1&seriesId=5
  params:
    - name: id
      value: "1"
      type: query
    - name: seriesId
      value: "5"
      type: query
  body:
    type: json
    data: |-
      {
          "id": 23,
          "name": "Birthday!",
          "description": "Having a birthday party I suppose",
          "location": "Grandma's House"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
